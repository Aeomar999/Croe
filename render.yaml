services:
  - type: web
    name: croe-api
    env: node
    buildCommand: cd backend && corepack enable pnpm && pnpm install && pnpm build && pnpm db:migrate
    startCommand: cd backend && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CUSTODY_PHASE
        value: P1
      - key: DATABASE_URL
        fromDatabase:
          name: croe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: croe-redis
          property: connectionString
      - key: PORT
        value: 8080
      # These must be set manually in the Render dashboard:
      # - MOMO_WEBHOOK_SECRET
      # - JWT_SECRET
      # - OTP_PEPPER
      # - AGGREGATOR_API_KEY
      # - AGGREGATOR_BASE_URL
      # - S3_ACCESS_KEY
      # - S3_SECRET_KEY
      # - S3_BUCKET
      # - S3_ENDPOINT
      # - CORS_ORIGIN

  - type: redis
    name: croe-redis
    plan: free # Change to a paid plan for persistence in production
    ipAllowList: []

databases:
  - name: croe-db
    databaseName: croe
    user: croe
    plan: free # Change to a paid plan for PITR and backups in production
    ipAllowList: []
