name: CI/CD Pipeline

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter croe-backend typecheck
      - run: pnpm --filter @croe/admin typecheck
      - run: pnpm --filter croe-mobile typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --recursive --if-present lint

  test-backend:
    name: Tests (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: croe
          POSTGRES_PASSWORD: test
          POSTGRES_DB: croe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U croe -d croe_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://croe:test@localhost:5432/croe_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-ci-only
      OTP_PEPPER: test-otp-pepper-ci-only
      MOMO_WEBHOOK_SECRET: test-webhook-secret-ci-only
      CUSTODY_PHASE: P0
      LLM_URL: http://localhost:11434
      LLM_MODEL: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Migration Dry Run & Setup
        run: pnpm --filter croe-backend db:migrate
      - name: Run Backend Tests
        run: pnpm --filter croe-backend test

  test-mobile:
    name: Tests (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter croe-mobile test:ci

  test-admin:
    name: Tests (admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @croe/admin test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter croe-backend build
      - run: pnpm --filter @croe/admin build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  docker-build:
    name: Verify Docker Build (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t croe-backend:ci -f backend/Dockerfile backend/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, test-backend, test-admin, test-mobile, docker-build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Trigger Staging Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}" ]; then
            curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_STAGING }}
          else
            echo "Staging webhook not configured. Skipping."
          fi

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.croe.co
    steps:
      - name: Trigger Production Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}" ]; then
            curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_PROD }}
          else
            echo "Production webhook not configured. Skipping."
          fi